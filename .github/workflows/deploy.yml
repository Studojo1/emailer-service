name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: acrstudojo-dhfsdrfhf6a6bbg2.azurecr.io
  ACR_NAME: acrstudojo
  SERVICE_NAME: emailer-service
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          TOKEN=$(az acr login --name ${{ env.ACR_NAME }} --expose-token --output tsv --query accessToken)
          docker login ${{ env.REGISTRY }} -u 00000000-0000-0000-0000-000000000000 -p "$TOKEN"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:buildcache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} \
            --name ${{ secrets.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Secrets as secretKeyRef (audit ST-N07)
        env:
          ACS_EMAIL_CONNECTION_STRING: ${{ secrets.ACS_EMAIL_CONNECTION_STRING }}
          ACS_EMAIL_CONNECTION_STRING_2: ${{ secrets.ACS_EMAIL_CONNECTION_STRING_2 }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
        run: |
          # Every secret lives in app-secrets and reaches the pod through
          # secretKeyRef, never as a literal value in the Deployment spec, where
          # anyone who can read Deployments or old ReplicaSets sees it.
          # scripts/ci/secret_env.sh explains; scripts/ci/check_no_literal_secrets.sh
          # fails CI if a workflow writes one back. GitHub secrets are stored (an
          # empty one changes nothing), hand-set literals adopted once.
          export NS=studojo DEP=${{ env.SERVICE_NAME }}
          . scripts/ci/secret_env.sh
          secret_put acs-email-connection-string "$ACS_EMAIL_CONNECTION_STRING"
          secret_put acs-email-connection-string-2 "$ACS_EMAIL_CONNECTION_STRING_2"
          secret_put emailer-admin-secret "$ADMIN_SECRET"
          secret_put unsubscribe-secret "$UNSUBSCRIBE_SECRET"
          secret_adopt AZURE_EMAIL_CONNECTION_STRING acs-email-connection-string
          secret_adopt AZURE_EMAIL_CONNECTION_STRING_2 acs-email-connection-string-2
          secret_adopt AZURE_EMAIL_CONNECTION_STRING_3 acs-email-connection-string-3
          secret_adopt ADMIN_SECRET emailer-admin-secret
          secret_adopt UNSUBSCRIBE_SECRET unsubscribe-secret
          # INTERNAL_SECRET is shared by the frontend, control-plane,
          # job-outreach-svc and cc-backend through app-secrets/emailer-internal-secret.
          # It is not written from a GitHub secret here: pods read secretKeyRef at
          # start, so changing it from one repo would split the services until
          # every one restarted. Rotate it in app-secrets and restart them together.
          secret_adopt INTERNAL_SECRET emailer-internal-secret
          secret_audit

      - name: Ensure ACS email env in deployment
        run: |
          kubectl set env deployment/${{ env.SERVICE_NAME }} -n studojo \
            RESEND_API_KEY- \
            AZURE_EMAIL_SENDER_ADDRESS="Pranav from Studojo <pranav@support.studojo.com>" \
            EMAIL_SENDER_SUPPORT="Pranav from Studojo <pranav@support.studojo.com>" \
            EMAIL_SENDER_WELCOME="Jeremy from Studojo <jeremy@welcome.studojo.pro>" \
            EMAIL_SENDER_PROMOTIONS="Vanshika from Studojo <vanshika@promotions.studojo.pro>" \
            TRACKING_BASE_URL="https://email.studojo.com" \
            EMAIL_RATE_PER_HOUR="80"

      - name: Apply mail.studojo.com ingress
        run: |
          kubectl apply -f k8s/mail-ingress.yaml

      - name: Deploy to Kubernetes
        run: |
          # Start the new pod before stopping the old one (audit IN-N03). With
          # one replica, maxSurge=0 made every deploy a hard outage for
          # unsubscribe/click links and in-flight sends. The pod requests 100m
          # CPU, so one extra pod for ~30s fits. The scheduler elects a leader
          # via a Postgres advisory lock, so the overlap cannot double-send.
          kubectl patch deployment/${{ env.SERVICE_NAME }} -n studojo \
            -p '{"spec":{"strategy":{"type":"RollingUpdate","rollingUpdate":{"maxSurge":1,"maxUnavailable":0}}}}'
          # PRESTOP_DRAIN (audit AR-B01): the pod kept serving for a few seconds after
          # SIGTERM while ingress-nginx still routed to it, so every rollout
          # answered a burst of 502s to live users. Sleep before shutdown so
          # the endpoint is removed first. Native sleep action (k8s >= 1.30),
          # so it needs no shell in the image.
          kubectl patch deployment/${{ env.SERVICE_NAME }} -n studojo --type strategic -p \
            '{"spec":{"template":{"spec":{"containers":[{"name":"${{ env.SERVICE_NAME }}","lifecycle":{"preStop":{"sleep":{"seconds":10}}}}]}}}}'
          kubectl set image deployment/${{ env.SERVICE_NAME }} ${{ env.SERVICE_NAME }}=${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }} -n studojo
          kubectl rollout status deployment/${{ env.SERVICE_NAME }} -n studojo --timeout=10m || {
            echo "Rollout failed or timed out. Checking pod status..."
            kubectl get pods -n studojo -l app=${{ env.SERVICE_NAME }} -o wide
            echo ""
            PODS=$(kubectl get pods -n studojo -l app=${{ env.SERVICE_NAME }} --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[*].metadata.name}')
            for POD in $PODS; do
              echo "=== Logs for $POD ==="
              kubectl logs -n studojo $POD --tail=80 2>&1 || true
              echo "=== Previous logs for $POD ==="
              kubectl logs -n studojo $POD --previous --tail=80 2>&1 || true
              echo "=== Events for $POD ==="
              kubectl get events -n studojo --field-selector involvedObject.name=$POD --sort-by='.lastTimestamp' 2>&1 | tail -10 || true
            done
            exit 1
          }

      - name: Record deployment
        run: |
          curl -X POST https://api.studojo.com/v1/dev/deployments \
            -H "Content-Type: application/json" \
            -H "X-Deployment-Secret: ${{ secrets.DEPLOYMENT_SECRET }}" \
            -d '{
              "service": "${{ env.SERVICE_NAME }}",
              "version": "${{ env.IMAGE_TAG }}",
              "deployed_at": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'",
              "deployed_by": "${{ github.actor }}",
              "status": "success",
              "workflow_run": ${{ github.run_id }}
            }' || echo "Failed to record deployment (non-critical)"
