name: Build and Deploy (Staging)

on:
  push:
    branches: [staging]

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: acrstudojo-dhfsdrfhf6a6bbg2.azurecr.io
  ACR_NAME: acrstudojo
  SERVICE_NAME: emailer-service
  IMAGE_TAG: staging-${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          TOKEN=$(az acr login --name ${{ env.ACR_NAME }} --expose-token --output tsv --query accessToken)
          docker login ${{ env.REGISTRY }} -u 00000000-0000-0000-0000-000000000000 -p "$TOKEN"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:staging
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:buildcache-staging
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:buildcache-staging,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} \
            --name ${{ secrets.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Secrets as secretKeyRef (audit ST-N07)
        run: |
          # Hand-set literals move into the staging app-secrets once (current
          # values kept) and are referenced from then on. scripts/ci/secret_env.sh.
          export NS=staging DEP=${{ env.SERVICE_NAME }}
          . scripts/ci/secret_env.sh
          secret_adopt INTERNAL_SECRET emailer-internal-secret
          secret_adopt UNSUBSCRIBE_SECRET unsubscribe-secret
          secret_audit

      - name: Deploy to Kubernetes
        run: |
          # Staging-only env (audit ST-N13): the ingress already sends CORS
          # headers, so the app must not add a second set (prod sets no
          # CORS_ORIGINS either), and reset/verify links must point at
          # studojo.pro, not production.
          kubectl set env deployment/${{ env.SERVICE_NAME }} -n staging CORS_ORIGINS- EMAIL_FRONTEND_URL=https://studojo.pro
          # Zero-downtime rollout, same as prod (audit IN-N03).
          kubectl patch deployment/${{ env.SERVICE_NAME }} -n staging \
            -p '{"spec":{"strategy":{"type":"RollingUpdate","rollingUpdate":{"maxSurge":1,"maxUnavailable":0}}}}'
          # PRESTOP_DRAIN (audit AR-B01): the pod kept serving for a few seconds after
          # SIGTERM while ingress-nginx still routed to it, so every rollout
          # answered a burst of 502s to live users. Sleep before shutdown so
          # the endpoint is removed first. Native sleep action (k8s >= 1.30),
          # so it needs no shell in the image.
          kubectl patch deployment/${{ env.SERVICE_NAME }} -n staging --type strategic -p \
            '{"spec":{"template":{"spec":{"containers":[{"name":"${{ env.SERVICE_NAME }}","lifecycle":{"preStop":{"sleep":{"seconds":10}}}}]}}}}'
          kubectl set image deployment/${{ env.SERVICE_NAME }} ${{ env.SERVICE_NAME }}=${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }} -n staging
          kubectl rollout status deployment/${{ env.SERVICE_NAME }} -n staging --timeout=10m || {
            echo "Rollout failed or timed out. Checking pod status..."
            kubectl get pods -n staging -l app=${{ env.SERVICE_NAME }} -o wide
            echo ""
            echo "Recent pod events:"
            LATEST_POD=$(kubectl get pods -n staging -l app=${{ env.SERVICE_NAME }} --sort-by=.metadata.creationTimestamp -o jsonpath='{{.items[-1].metadata.name}}' 2>/dev/null || echo "")
            if [ -n "$LATEST_POD" ]; then
              kubectl get events -n staging --field-selector involvedObject.name=$LATEST_POD --sort-by='.lastTimestamp' | tail -20 || true
              echo ""
              echo "Pod logs:"
              kubectl logs -n staging $LATEST_POD --tail=50 || true
            fi
            exit 1
          }

      - name: Record deployment
        run: |
          curl -X POST https://api.studojo.com/v1/dev/deployments \
            -H "Content-Type: application/json" \
            -H "X-Deployment-Secret: ${{ secrets.DEPLOYMENT_SECRET }}" \
            -d '{
              "service": "${{ env.SERVICE_NAME }}-staging",
              "version": "${{ env.IMAGE_TAG }}",
              "deployed_at": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'",
              "deployed_by": "${{ github.actor }}",
              "status": "success",
              "workflow_run": ${{ github.run_id }}
            }' || echo "Failed to record deployment (non-critical)"
