# Runs on every pull request and every push to main/staging. Required to pass
# before merging (branch protection).
name: Tests

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      # Formatting, vet and staticcheck were all clean when added, so any
      # finding is new and fails the check.
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run: gofmt -w ."; exit 1; }
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - run: go test ./...
