# Runs on every pull request and every push to main/staging. Required to pass
# before merging (branch protection).
name: Tests

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      # Formatting, vet and staticcheck were all clean when added, so any
      # finding is new and fails the check.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo "These files need gofmt -w"
            exit 1
          fi
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - run: go test ./...
      # Deploy workflows never write a secret into a Deployment as a literal
      # env value (audit ST-N07).
      - run: bash scripts/ci/check_no_literal_secrets.sh
